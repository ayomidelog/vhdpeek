name: build

# Builds the portable Windows executable: a single windowed binary that opens
# the browser when double-clicked. Runs on a tag so a release has something to
# attach, and on demand so a build can be checked without one.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write        # needed to attach the zip to a release

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Portable exe
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller requests

      # `--windowed` sets the PE subsystem to "windows", so double-clicking
      # spawns no console window behind the app. One binary, one job.
      - name: Build the executable
        run: >
          python -m PyInstaller
          --noconfirm --clean --onefile --windowed
          --name vhdpeek
          --icon assets/vhdpeek.ico
          --hidden-import requests
          --paths .
          packaging/entry_gui.py

      - name: Generate sample images
        run: python tools/make_test_images.py

      # A windowed binary has no stdout, so the checks are behavioural: the
      # process must start, stay alive (i.e. reach its main loop without
      # raising), and exit cleanly when closed.
      - name: Smoke-test the frozen binary
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (-not (Test-Path .\dist\vhdpeek.exe)) {
            throw "the executable was not produced"
          }

          # --help exits 0 through argparse, which proves the bundle imports
          # and the argument parser is wired up.
          $help = Start-Process -FilePath .\dist\vhdpeek.exe -ArgumentList "--help" `
                                -Wait -PassThru -NoNewWindow
          if ($help.ExitCode -ne 0) {
            throw "--help exited $($help.ExitCode)"
          }

          # Opening a real image must reach the event loop and stay there.
          $app = Start-Process -FilePath .\dist\vhdpeek.exe `
                               -ArgumentList "test_data\test_fixed.vhd" -PassThru
          Start-Sleep -Seconds 12
          if ($app.HasExited) {
            throw "the window exited immediately with code $($app.ExitCode)"
          }
          Stop-Process -Id $app.Id -Force
          Write-Host "frozen binary starts and stays up"

      - name: Package
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if (-not $env:GITHUB_REF.StartsWith("refs/tags/")) { $tag = "dev" }
          $name = "vhdpeek-$tag-windows-x64"
          New-Item -ItemType Directory -Path dist\pkg | Out-Null
          Copy-Item dist\vhdpeek.exe, README.md, LICENSE dist\pkg\
          Compress-Archive -Path dist\pkg\* -DestinationPath "dist\$name.zip"
          echo "ZIP=dist/$name.zip" >> $env:GITHUB_ENV

      - name: Upload the portable build
        uses: actions/upload-artifact@v4
        with:
          name: vhdpeek-windows-x64
          path: ${{ env.ZIP }}
          if-no-files-found: error

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title $tag --generate-notes
          }
          gh release upload $tag $env:ZIP --clobber
