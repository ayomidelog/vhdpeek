name: build

# Builds the portable Windows executable. Runs on a tag so a release has
# something to attach, and on demand so a build can be checked without one.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write        # needed to attach the zip to a release

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Portable exe
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller requests

      # Two builds, because one exe cannot be both:
      #   vhdpeek.exe      console subsystem, so --cat can stream to stdout
      #   vhdpeek-gui.exe  window subsystem, so the GUI leaves no black window
      - name: Build the console executable
        run: >
          python -m PyInstaller
          --noconfirm --clean --onefile --console
          --name vhdpeek
          --hidden-import requests
          --paths .
          packaging/entry_cli.py

      - name: Build the windowed executable
        run: >
          python -m PyInstaller
          --noconfirm --clean --onefile --windowed
          --name vhdpeek-gui
          --hidden-import requests
          --paths .
          packaging/entry_gui.py

      - name: Generate sample images
        run: python tools/make_test_images.py

      # An exe that builds but cannot read an image is worse than no exe, so
      # the frozen binary is exercised rather than just produced.
      - name: Smoke-test the frozen binary
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          .\dist\vhdpeek.exe --help | Out-Null
          .\dist\vhdpeek.exe test_data\test_fixed.vhd --parts
          .\dist\vhdpeek.exe test_data\test_vhdx.vhdx --ls /docs

          $out = .\dist\vhdpeek.exe test_data\test_fixed.vhd --cat /readme.txt
          if (-not ($out -match "Hello from vhdpeek")) {
            throw "unexpected --cat output: $out"
          }

          # The GUI build must at least import and parse its arguments.
          if (-not (Test-Path .\dist\vhdpeek-gui.exe)) {
            throw "windowed build missing"
          }
          Write-Host "frozen binary OK"

      - name: Package
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if (-not $env:GITHUB_REF.StartsWith("refs/tags/")) { $tag = "dev" }
          $name = "vhdpeek-$tag-windows-x64"
          New-Item -ItemType Directory -Path dist\pkg | Out-Null
          Copy-Item dist\vhdpeek.exe, dist\vhdpeek-gui.exe, README.md, LICENSE dist\pkg\
          Compress-Archive -Path dist\pkg\* -DestinationPath "dist\$name.zip"
          echo "ZIP=dist/$name.zip" >> $env:GITHUB_ENV

      - name: Upload the portable build
        uses: actions/upload-artifact@v4
        with:
          name: vhdpeek-windows-x64
          path: ${{ env.ZIP }}
          if-no-files-found: error

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title $tag --generate-notes
          }
          gh release upload $tag $env:ZIP --clobber
