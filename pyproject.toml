[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vhdpeek"
version = "1.0.0"
description = "Browse VHD/VHDX disk images over HTTP or locally, without downloading or mounting them"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "ayomidelog" }]
keywords = ["vhd", "vhdx", "disk-image", "filesystem", "forensics", "http"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Filesystems",
    "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
# Only http(s) sources need this; local images are standard library only.
http = ["requests>=2.28"]

[project.scripts]
# One command; `--gui` opens the window. The portable Windows exe is a
# separate, windowed build of the same program - it has no console, so it
# cannot offer this command line.
vhdpeek = "vhdpeek.cli:main"

[project.urls]
Homepage = "https://github.com/ayomidelog/vhdpeek"
Issues = "https://github.com/ayomidelog/vhdpeek/issues"

[tool.setuptools.packages.find]
include = ["vhdpeek*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
